<!doctype html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vogelbingo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%90%A6%3C/text%3E%3C/svg%3E">
<meta name="description" content="Maak een printbare vogelbingokaart voor jouw postcode en maand, met alleen vogels die daar dan echt te zien zijn.">
<style>
  :root {
    --sky: #eaf4f4;
    --card: #fbf8f1;
    --ink: #1f2d2b;
    --accent: #3f7d5e;
    --accent-dark: #2c5c44;
    --border: #d8e6df;
    --rule: #8a7a5a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: Georgia, "Times New Roman", serif;
    background: linear-gradient(180deg, #d7ecf0 0%, var(--sky) 260px, var(--sky) 100%);
    color: var(--ink);
    padding: 32px 16px 64px;
  }
  main { max-width: 720px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 2.2rem; color: var(--accent-dark); }
  .lede { margin: 0 0 24px; font-size: 1.05rem; }
  form {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    display: grid;
    gap: 16px;
    box-shadow: 0 6px 20px rgba(30, 60, 50, 0.08);
  }
  label { display: grid; gap: 6px; font-weight: 600; }
  input[type=text], select {
    font: inherit; font-size: 1.1rem; padding: 10px 12px;
    border: 1px solid #b9cbc3; border-radius: 8px; width: 100%;
  }
  fieldset { border: none; padding: 0; margin: 0; display: grid; gap: 8px; }
  legend { font-weight: 600; padding: 0; margin-bottom: 6px; }
  .tier { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; font-weight: 400; }
  .tier input { margin-top: 5px; }
  .tier b { display: block; }
  .tier small { color: #4d5c59; }
  button {
    font: inherit; font-size: 1.1rem; font-weight: 600; color: #fff;
    background: var(--accent); border: none; border-radius: 8px; padding: 12px 18px; cursor: pointer;
  }
  button:disabled { background: #9db8ab; cursor: wait; }
  button.secondary { background: #fff; color: var(--accent-dark); border: 1px solid var(--accent); }
  #form-error { color: #9b2c2c; font-weight: 600; margin: 0; }
  .actions { display: flex; gap: 12px; align-items: center; margin: 24px 0 12px; }
  .fineprint { font-size: 0.85rem; color: #4d5c59; }

  /* Card */
  .card {
    background: var(--card);
    border: 1px solid #d9d0bd;
    border-radius: 6px;
    padding: 18px 18px 14px;
    margin: 12px 0 0;
    box-shadow: 0 8px 26px rgba(30, 60, 50, 0.12);
  }
  .card-head { text-align: center; margin-bottom: 12px; }
  .card-title {
    margin: 0; font-size: 2rem; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--accent-dark); font-weight: 700;
  }
  .card-sub { margin: 4px 0 0; font-style: italic; font-size: 1.05rem; }
  .card-number { margin-left: 0.6em; font-style: normal; }
  .grid {
    display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px;
  }
  .cell {
    position: relative; aspect-ratio: 1 / 1; overflow: hidden; min-width: 0;
    border: 1px solid var(--rule); background: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 6px 4px; gap: 2px;
  }
  .cell .plate { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
  .cell .name { position: relative; font-weight: 700; font-size: 0.95rem; line-height: 1.1; max-width: 100%; overflow-wrap: anywhere; hyphens: auto; }
  .cell .sci { position: relative; font-style: italic; font-size: 0.68rem; color: #5a5040; line-height: 1.1; max-width: 100%; overflow-wrap: anywhere; }
  .cell:not(.cell--noimage) .name,
  .cell:not(.cell--noimage) .sci {
    background: rgba(251, 248, 241, 0.92); padding: 1px 4px; border-radius: 2px;
  }
  .cell:not(.cell--noimage) { justify-content: flex-end; }
  .cell--noimage::before {
    content: ""; position: absolute; inset: 5px; border: 1px double var(--rule); border-radius: 2px; pointer-events: none;
  }
  .cell--free { background: var(--card); }
  .free-mark { font-weight: 700; letter-spacing: 0.06em; font-size: 0.7rem; color: var(--accent-dark); text-transform: uppercase; max-width: 100%; overflow-wrap: anywhere; }
  .free-sub { font-style: italic; font-size: 0.8rem; }
  .card-foot { margin-top: 10px; font-size: 0.75rem; color: #4d5c59; text-align: center; }
  .card-foot p { margin: 2px 0; }
  .caller-sheet ol { columns: 2; }

  @media (max-width: 480px) {
    .cell .sci { display: none; }
    .cell { padding: 3px 2px; }
    .cell--noimage::before { inset: 3px; }
    .grid { gap: 3px; }
    .card { padding: 10px; }
    .card-title { font-size: 1.4rem; }
    .free-mark { font-size: 0.48rem; letter-spacing: 0; }
    .cell .name { font-size: 0.62rem; }
  }
</style>
<link rel="stylesheet" href="src/print.css" media="print">
</head>
<body>
<main>
  <div class="no-print">
    <h1>🐦 Vogelbingo</h1>
    <p class="lede">Een printbare bingokaart met de vogels die <em>nu</em>, bij <em>jou</em> in de buurt te zien zijn.
      Vul je postcode in, kies een maand en print de kaart. Eén kaart is compleet voor één speler.</p>

    <form id="generator" autocomplete="off" novalidate>
      <label>Postcode (4 cijfers)
        <input type="text" name="postcode" inputmode="numeric" placeholder="bijv. 1012" maxlength="7" required>
      </label>
      <label>Maand
        <select name="month"></select>
      </label>
      <fieldset>
        <legend>Niveau</legend>
        <label class="tier"><input type="radio" name="tier" value="makkelijk"><span><b>Makkelijk</b><small>De 24 meest waargenomen vogels.</small></span></label>
        <label class="tier"><input type="radio" name="tier" value="normaal" checked><span><b>Normaal</b><small>Vooral bekende vogels, plus acht die je moet zoeken.</small></span></label>
        <label class="tier"><input type="radio" name="tier" value="expert"><span><b>Expert</b><small>Een derde algemeen, een derde gewoon, een derde schaars.</small></span></label>
      </fieldset>
      <p id="form-error" role="alert" hidden></p>
      <button type="submit">Maak bingokaart</button>
    </form>

    <div class="actions">
      <button type="button" id="print" class="secondary" hidden>Printen</button>
    </div>
  </div>

  <div id="output" hidden></div>

  <p class="fineprint no-print">Dezelfde postcode, maand en niveau geven altijd dezelfde kaart. Zie
    <a href="ATTRIBUTION.md">bronvermelding</a>.</p>
</main>
<script type="module" src="src/app.js"></script>
</body>
</html>
