<!doctype html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vogelbingo</title>
<style>
  :root {
    --sky: #eaf4f4;
    --card: #ffffff;
    --ink: #1f2d2b;
    --accent: #3f7d5e;
    --accent-dark: #2c5c44;
    --border: #d8e6df;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, #d7ecf0 0%, var(--sky) 260px, var(--sky) 100%);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
  }
  h1 {
    margin: 0 0 6px;
    font-size: 2.2rem;
    color: var(--accent-dark);
  }
  .wip {
    display: inline-block;
    margin-bottom: 24px;
    padding: 8px 18px;
    background: #fff3d6;
    border: 1px solid #f0cf7a;
    color: #7a5a10;
    border-radius: 999px;
    font-weight: 600;
    font-size: 1rem;
  }
  video {
    max-width: 100%;
    width: 560px;
    border-radius: 14px;
    box-shadow: 0 6px 20px rgba(30, 60, 50, 0.15);
    background: #000;
  }
</style>
</head>
<body>
  <h1>🐦 Vogelbingo</h1>
  <p class="wip">🚧 Hier wordt een website gebouwd voor het genereren van vogelbingo kaarten 🚧</p>

  <video src="bingomolen.mp4" controls autoplay loop muted playsinline></video>
</body>
</html>
